name: memory_swap
description: Store two i32 values at memory offsets 0 and 4, then swap them. Export a function that takes two values, swaps them in memory, and returns the value originally at offset 0 (now at offset 4).
target: wat

signature:
  inputs:
    - name: a
      type: i32
    - name: b
      type: i32
  output:
    type: i32

export: memory_swap
memory: 1

tests:
  - inputs: { a: 10, b: 20 }
    expect: 10
  - inputs: { a: 0, b: 99 }
    expect: 0
  - inputs: { a: -5, b: 5 }
    expect: -5
