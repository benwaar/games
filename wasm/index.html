<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23111'/><text x='2' y='13' font-family='monospace' font-size='14' font-weight='bold' fill='%230055ff'>G</text></svg>" />
  <title>Glyph WASM Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #111; min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      font-family: monospace; color: #ccc; gap: 12px;
    }
    canvas {
      max-width: calc(100vw - 24px);
      max-height: 80vh;
      image-rendering: pixelated;
      border: 2px solid #333;
    }
    #status { font-size: 12px; color: #888; }
    .controls { display: flex; gap: 8px; }
    button.btn {
      cursor: pointer; background: #333; color: #ccc;
      font-family: monospace; font-size: 13px;
      padding: 5px 16px; border: 1px solid #666; border-radius: 3px;
    }
    button.btn:hover { background: #444; }
    #autoplay-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: none; justify-content: center; align-items: center;
      cursor: pointer; z-index: 10;
    }
    #autoplay-overlay span {
      font-family: monospace; color: #ccc; font-size: 18px;
      border: 1px solid #666; padding: 12px 24px; border-radius: 4px;
    }
    .canvas-wrap { position: relative; display: inline-block; }
    .mirror-dom {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    }
    .sr-only {
      position: absolute; overflow: hidden;
      width: 1px; height: 1px; padding: 0; margin: -1px;
      clip: rect(0,0,0,0); border: 0;
    }
  </style>
</head>
<body>
  <div class="canvas-wrap">
    <canvas id="screen" role="img" aria-label="Game content"></canvas>
    <div id="mirror" class="mirror-dom" aria-hidden="false"></div>
  </div>
  <div id="status" role="status" aria-live="polite">Loading…</div>
  <div class="controls">
    <button id="pause-btn" class="btn" style="display:none">⏸ Pause (P)</button>
  </div>
  <div id="autoplay-overlay"><span>Click to start</span></div>

  <script type="module">
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const pauseBtn = document.getElementById('pause-btn');
    const overlay = document.getElementById('autoplay-overlay');

    const overrides = { dark: null, motion: null, contrast: null };
    const mirror = document.getElementById('mirror');

    function buildMirrorDom(nodes, cw, ch) {
      mirror.innerHTML = '';
      const announcer = document.createElement('div');
      announcer.setAttribute('aria-live', 'polite');
      announcer.className = 'sr-only';
      announcer.id = 'announcer';
      mirror.appendChild(announcer);

      for (const node of nodes) {
        const div = document.createElement('div');
        div.setAttribute('role', node.role || 'img');
        div.setAttribute('aria-label', node.label || '');
        div.tabIndex = 0;
        div.style.position = 'absolute';
        div.style.left = ((node.x || 0) / cw * 100) + '%';
        div.style.top = ((node.y || 0) / ch * 100) + '%';
        div.style.width = ((node.w || cw) / cw * 100) + '%';
        div.style.height = ((node.h || ch) / ch * 100) + '%';
        div.className = 'sr-only';
        mirror.appendChild(div);
      }

      if (nodes.length > 0) {
        canvas.setAttribute('aria-label', nodes[0].label || 'Game content');
      }
    }

    function drawNoContent() {
      canvas.width = 256; canvas.height = 256;
      canvas.style.aspectRatio = '1 / 1';
      ctx.strokeStyle = '#0055ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(256,256); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(256,0); ctx.lineTo(0,256); ctx.stroke();
    }

    let ac = null;
    let gainNode = null;
    let playing = false;
    let audioNotes = null;

    function scheduleAudio() {
      if (!audioNotes || !ac) return;
      const gain = ac.createGain();
      gain.gain.value = 0.3;
      gain.connect(ac.destination);
      gainNode = gain;
      let t = ac.currentTime + 0.05;
      for (let i = 0; i < audioNotes.freqs.length; i++) {
        const freq = audioNotes.freqs[i];
        const dur  = audioNotes.durs[i] / 1000;
        if (freq > 0) {
          const osc = ac.createOscillator();
          osc.type = 'square';
          osc.frequency.value = freq;
          osc.connect(gain);
          osc.start(t);
          osc.stop(t + dur);
        }
        t += dur;
      }
      playing = true;
      pauseBtn.textContent = '⏸ Pause (P)';
    }

    function togglePause() {
      if (!ac) return;
      if (ac.state === 'running') {
        ac.suspend();
        playing = false;
        pauseBtn.textContent = '▶ Play (P)';
      } else {
        ac.resume();
        playing = true;
        pauseBtn.textContent = '⏸ Pause (P)';
      }
    }

    pauseBtn.addEventListener('click', togglePause);
    document.addEventListener('keydown', e => {
      if (e.code === 'KeyP') togglePause();
    });

    async function startAudio() {
      ac = new AudioContext();
      if (ac.state === 'suspended') {
        overlay.style.display = 'flex';
        await new Promise(resolve => {
          overlay.addEventListener('click', async () => {
            await ac.resume();
            overlay.style.display = 'none';
            resolve();
          }, { once: true });
        });
      }
      scheduleAudio();
    }

    async function load() {
      let instance;
      try {
        const res = await fetch('./debug.wasm');
        if (!res.ok) throw new Error('fetch failed');
        const bytes = await res.arrayBuffer();
        const imports = {
          env: {
            prefers_dark: () => overrides.dark ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 1 : 0),
            prefers_reduced_motion: () => overrides.motion ?? (matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 0),
            prefers_high_contrast: () => overrides.contrast ?? (matchMedia('(prefers-contrast: more)').matches ? 1 : 0),
          }
        };
        ({ instance } = await WebAssembly.instantiate(bytes, imports));
      } catch (_) {
        drawNoContent();
        status.textContent = 'No debug.wasm — run pipeline first';
        return;
      }

      const exp = instance.exports;
      const mem = exp.memory?.buffer;

      if (typeof exp.type !== 'function') {
        const w = exp.width(); const h = exp.height();
        canvas.width = w; canvas.height = h;
        canvas.style.aspectRatio = `${w} / ${h}`;
        exp.render();
        ctx.putImageData(new ImageData(new Uint8ClampedArray(mem, 0, w * h * 4), w, h), 0, 0);
        status.textContent = `Image: ${w}×${h} (legacy)`;
        return;
      }

      const type = exp.type();
      const hasImage = type & 1;
      const hasAudio = type & 2;
      const parts = [];

      if (hasImage) {
        const w = exp.width(); const h = exp.height();
        canvas.width = w; canvas.height = h;
        canvas.style.aspectRatio = `${w} / ${h}`;
        exp.render();
        ctx.putImageData(new ImageData(new Uint8ClampedArray(mem, 0, w * h * 4), w, h), 0, 0);
        parts.push(`Image: ${w}×${h}`);
      } else {
        drawNoContent();
        parts.push('No image');
      }

      if (hasAudio) {
        const count = exp.audio_count();
        const off = exp.audio_offset();
        const freqs = new Float64Array(mem, off, count);
        const durs = new Float64Array(mem, off + count * 8, count);
        audioNotes = { freqs: Array.from(freqs), durs: Array.from(durs) };
        parts.push(`Audio: ${count} notes`);
        pauseBtn.style.display = 'block';
        startAudio();
      }

      if (type & 4) {
        document.addEventListener('keydown', e => console.log('keydown', e.key));
        document.addEventListener('keyup', e => console.log('keyup', e.key));
        parts.push('Keyboard: active');
      }

      if (type & 8) {
        const off = exp.a11y_offset();
        const size = exp.a11y_size();
        const raw = new Uint8Array(mem, off, size);
        try {
          const nodes = JSON.parse(new TextDecoder().decode(raw));
          const cw = hasImage ? exp.width() : 256;
          const ch = hasImage ? exp.height() : 256;
          buildMirrorDom(nodes, cw, ch);
          parts.push(`A11y: ${nodes.length} nodes`);
        } catch (_) {
          parts.push('A11y: parse error');
        }
      }

      if (!parts.length) parts.push('No content');
      status.textContent = parts.join(' | ');
    }

    load();
  </script>
</body>
</html>
