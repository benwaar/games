<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23111'/><text x='2' y='13' font-family='monospace' font-size='14' font-weight='bold' fill='%230055ff'>G</text></svg>" />
  <title>Glyph WASM Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div class="canvas-wrap">
    <canvas id="screen" role="img" aria-label="Game content"></canvas>
    <div id="mirror" class="mirror-dom"></div>
    <button id="settings-btn" class="settings-btn" aria-label="Settings" aria-expanded="false" aria-controls="settings-panel">⚙</button>
    <div id="settings-panel" class="settings-panel" hidden>
      <div class="settings-header">
        <span>Settings</span>
        <button id="settings-close" class="settings-close" aria-label="Close settings">✕</button>
      </div>
      <section aria-labelledby="prefs-heading">
        <h2 id="prefs-heading" class="settings-section-title">Preferences</h2>
        <div class="pref-row">
          <label for="toggle-dark">Dark mode</label>
          <span class="pref-controls">
            <span class="pref-browser" id="browser-dark">Browser: —</span>
            <select class="pref-toggle" id="toggle-dark" aria-label="Dark mode override">
              <option value="auto">Auto</option>
              <option value="on">On</option>
              <option value="off">Off</option>
            </select>
          </span>
        </div>
        <div class="pref-row">
          <label for="toggle-motion">Reduced motion</label>
          <span class="pref-controls">
            <span class="pref-browser" id="browser-motion">Browser: —</span>
            <select class="pref-toggle" id="toggle-motion" aria-label="Reduced motion override">
              <option value="auto">Auto</option>
              <option value="on">On</option>
              <option value="off">Off</option>
            </select>
          </span>
        </div>
        <div class="pref-row">
          <label for="toggle-contrast">High contrast</label>
          <span class="pref-controls">
            <span class="pref-browser" id="browser-contrast">Browser: —</span>
            <select class="pref-toggle" id="toggle-contrast" aria-label="High contrast override">
              <option value="auto">Auto</option>
              <option value="on">On</option>
              <option value="off">Off</option>
            </select>
          </span>
        </div>
      </section>
      <section aria-labelledby="palette-heading">
        <h2 id="palette-heading" class="settings-section-title">Colour palette</h2>
        <div class="pref-row">
          <label for="palette-select">Theme</label>
          <select id="palette-select" class="palette-select">
            <option value="default">Default</option>
            <option value="high-contrast">High contrast</option>
            <option value="deuteranopia">Deuteranopia</option>
          </select>
        </div>
      </section>
      <section aria-labelledby="audio-heading">
        <h2 id="audio-heading" class="settings-section-title">Audio</h2>
        <div class="pref-row">
          <label for="volume-slider">Volume</label>
          <span class="pref-controls">
            <input type="range" id="volume-slider" min="0" max="100" value="30" class="pref-toggle" style="width:80px" aria-label="Volume">
            <span id="volume-label" class="pref-browser">30%</span>
          </span>
        </div>
        <div class="pref-row">
          <label for="toggle-voice">Self-voicing</label>
          <span class="pref-controls">
            <select class="pref-toggle" id="toggle-voice" aria-label="Self-voicing">
              <option value="off">Off</option>
              <option value="on">On</option>
            </select>
          </span>
        </div>
      </section>
    </div>
  </div>
  <div id="status" role="status" aria-live="polite">Loading…</div>
  <div class="controls">
    <button id="pause-btn" class="btn" style="display:none">⏸ Pause (P)</button>
  </div>
  <div id="autoplay-overlay"><span>Click to start</span></div>

  <script type="module" src="player.js"></script>
</body>
</html>
