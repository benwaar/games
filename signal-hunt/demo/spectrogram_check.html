<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signal Hunt — Spectrogram Check</title>
  <style>
    body { font-family: monospace; background: #111; color: #ccc; padding: 2rem; }
    h1 { color: #fff; }
    table { border-collapse: collapse; margin: 1rem 0; }
    td, th { border: 1px solid #444; padding: 0.4rem 0.8rem; text-align: right; }
    th { color: #aaa; text-align: left; background: #1a1a1a; }
    .pass { color: #4f4; }
    .fail { color: #f44; }
    .info { color: #8af; }
    pre { background: #1a1a1a; padding: 1rem; overflow: auto; }
  </style>
</head>
<body>
<h1>Spectrogram Check</h1>
<p class="info">Validates JS Mel pipeline against Python (librosa) reference values. Test signal: 440 Hz sine, 1 s, 22050 Hz.</p>
<div id="output">Running...</div>

<script type="module">
import { extractFeatures, buildMelFilterbank, N_FFT, HOP_LENGTH, N_MELS, TARGET_FRAMES } from './browser_pipeline.js';

// Python reference stats for A4 440 Hz, 1 s at 22050 Hz.
// Generated by: signal-hunt/demo/reference_stats.json
const REF = {
  n_frames: 44,          // frames before padding
  db_min: -39.16,        // min of log-dB spectrogram (pre-normalise)
  db_max:  40.84,        // max of log-dB spectrogram (pre-normalise)
  normed_mean: 0.0,      // ~0 after normalise
  normed_std:  1.0,      // ~1 after normalise
};
const TOLERANCE = 0.10;  // 10% relative tolerance

function pct(val, ref) {
  if (ref === 0) return Math.abs(val) < 1e-6 ? 0 : Infinity;
  return Math.abs(val - ref) / Math.abs(ref);
}

function row(label, jsVal, refVal, toleranceOverride) {
  const tol = toleranceOverride ?? TOLERANCE;
  const err = pct(jsVal, refVal);
  const pass = err <= tol;
  return `<tr>
    <th>${label}</th>
    <td>${jsVal.toFixed(4)}</td>
    <td>${refVal.toFixed(4)}</td>
    <td>${(err * 100).toFixed(1)}%</td>
    <td class="${pass ? 'pass' : 'fail'}">${pass ? '✓ PASS' : '✗ FAIL'}</td>
  </tr>`;
}

async function run() {
  const SR = 22050;
  const duration = 1.0;
  const nSamples = Math.round(SR * duration);

  // Generate A4 440 Hz sine wave at 22050 Hz.
  const signal = new Float32Array(nSamples);
  for (let i = 0; i < nSamples; i++) {
    signal[i] = Math.sin(2 * Math.PI * 440 * i / SR);
  }

  const t0 = performance.now();
  const fb = buildMelFilterbank(SR);
  const normed = extractFeatures(signal, fb);
  const elapsed = performance.now() - t0;

  // Reconstruct intermediate stats from scratch for log-dB comparison.
  // Re-run pipeline but capture pre-normalise values.
  // (We reuse the normed output — mean and std are measurable from it directly.)
  const mean = normed.reduce((a, b) => a + b, 0) / normed.length;
  const variance = normed.reduce((a, b) => a + (b - mean) ** 2, 0) / normed.length;
  const std = Math.sqrt(variance);

  // Estimated raw frames (before padding) from signal length — matches librosa center=True.
  const pad = N_FFT >> 1;
  const paddedLen = signal.length + 2 * pad;
  const estFrames = Math.floor((paddedLen - N_FFT) / HOP_LENGTH) + 1;

  const out = document.getElementById('output');
  out.innerHTML = `
<p class="info">Pipeline time: <strong>${elapsed.toFixed(1)} ms</strong></p>
<table>
  <tr><th>Metric</th><th>JS value</th><th>Python ref</th><th>Error</th><th>Result</th></tr>
  ${row('frames before pad', estFrames, REF.n_frames, 0.001)}
  ${row('normed mean (≈0)', mean, REF.normed_mean, 0.01)}
  ${row('normed std (≈1)', std, REF.normed_std, 0.01)}
</table>
<pre>Signal: ${nSamples} samples @ ${SR} Hz
Filterbank: ${N_MELS} × ${N_FFT / 2 + 1}
Output tensor: [${N_MELS}, ${TARGET_FRAMES}]  (flat length: ${normed.length})
normed[0..4]: ${Array.from(normed.slice(0, 5)).map(v => v.toFixed(4)).join(', ')}
normed min/max: ${Math.min(...normed).toFixed(4)} / ${Math.max(...normed).toFixed(4)}</pre>
<p class="info">Note: 10% tolerance on mean/std covers floating-point differences between
librosa's Slaney filterbank and the JS implementation. db_min/max comparison
requires Python to re-export the pre-normalise values.</p>
`;
}

run().catch(e => {
  document.getElementById('output').innerHTML = `<pre class="fail">Error: ${e.message}\n${e.stack}</pre>`;
});
</script>
</body>
</html>
