[package]
name = "knowledge-mcp"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "knowledge-mcp"
path = "src/main.rs"

[dependencies]
rust-mcp-sdk = { version = "2", default-features = false, features = ["server", "stdio", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tract-onnx = "0.21"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[profile.release]
strip = true
lto = true
