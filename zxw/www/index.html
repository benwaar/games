<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>zxw — ZX Spectrum 48K</title>
  <style>
    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      gap: 16px;
    }
    canvas {
      image-rendering: pixelated;
      border: 4px solid #444;
      width: 512px;
      height: 384px;
    }
    .controls {
      color: #ccc;
      font-family: monospace;
      font-size: 13px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    label.btn {
      cursor: pointer;
      background: #333;
      padding: 6px 14px;
      border: 1px solid #666;
      border-radius: 3px;
    }
    label.btn:hover { background: #444; }
    button.btn {
      cursor: pointer;
      background: #1a3a1a;
      color: #ccc;
      font-family: monospace;
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid #2a6a2a;
      border-radius: 3px;
    }
    button.btn:hover { background: #2a4a2a; }
    button.btn:disabled { opacity: 0.4; cursor: default; }
    #status { color: #888; }
  </style>
</head>
<body>
  <canvas id="screen" width="256" height="192"></canvas>
  <div class="controls">
    <label class="btn">
      Load .scr
      <input type="file" id="scr-input" accept=".scr" style="display:none" />
    </label>
    <label class="btn">
      Load .rom
      <input type="file" id="rom-input" accept=".rom" style="display:none" />
    </label>
    <label class="btn">
      Load .tap
      <input type="file" id="tap-input" accept=".tap" style="display:none" />
    </label>
    <button class="btn" id="run-btn" disabled>Load &amp; Run</button>
    <span id="status">M1: checkerboard — load a .scr, or load ROM + TAP to run a program</span>
  </div>

  <script type="module">
    import init, { init as zxwInit, Emulator } from './pkg/zxw.js';

    await init();

    // M1 gate: checkerboard confirms scaffold still works
    zxwInit('screen');

    // M3/M4: Emulator instance
    const emulator = new Emulator('screen');
    const status = document.getElementById('status');
    const runBtn = document.getElementById('run-btn');

    let romLoaded = false;
    let tapLoaded = false;
    let rafId = null;

    // -----------------------------------------------------------------------
    // M3: .scr loading (kept for backwards compat)
    // -----------------------------------------------------------------------
    document.getElementById('scr-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const buf = await file.arrayBuffer();
      const data = new Uint8Array(buf);

      if (data.length < 6912) {
        status.textContent = `Error: expected ≥6912 bytes, got ${data.length}`;
        return;
      }

      emulator.load_screen(data.subarray(0, 6912));
      emulator.render_frame();
      status.textContent = `Loaded: ${file.name} (${data.length} bytes)`;
    });

    // -----------------------------------------------------------------------
    // M4: ROM loading
    // -----------------------------------------------------------------------
    document.getElementById('rom-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const buf = await file.arrayBuffer();
      const data = new Uint8Array(buf);

      emulator.load_rom(data);
      romLoaded = true;
      status.textContent = `ROM loaded: ${file.name} (${data.length} bytes)`;
      updateRunBtn();
    });

    // -----------------------------------------------------------------------
    // M4: TAP loading
    // -----------------------------------------------------------------------
    document.getElementById('tap-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const buf = await file.arrayBuffer();
      const data = new Uint8Array(buf);

      try {
        emulator.load_tap(data);
        tapLoaded = true;
        status.textContent = `TAP loaded: ${file.name} (${data.length} bytes)`;
      } catch (err) {
        status.textContent = `TAP error: ${err}`;
        tapLoaded = false;
      }
      updateRunBtn();
    });

    // -----------------------------------------------------------------------
    // Load & Run — starts the RAF loop once both ROM + TAP are ready
    // -----------------------------------------------------------------------
    runBtn.addEventListener('click', () => {
      if (!romLoaded || !tapLoaded) return;

      // Cancel any existing loop.
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      status.textContent = 'Running…';

      function frame() {
        try {
          emulator.step_frame();
        } catch (err) {
          status.textContent = `Error: ${err}`;
          return;
        }
        rafId = requestAnimationFrame(frame);
      }

      rafId = requestAnimationFrame(frame);
    });

    function updateRunBtn() {
      runBtn.disabled = !(romLoaded && tapLoaded);
      if (romLoaded && tapLoaded) {
        status.textContent = 'ROM + TAP ready — click Load & Run';
      }
    }

    // -----------------------------------------------------------------------
    // M5: Keyboard input — Spectrum key matrix + Kempston joystick
    //
    // Spectrum half-row layout (row, bit):
    //   Row 0: SHIFT(0) Z(1) X(2) C(3) V(4)
    //   Row 1: A(0)     S(1) D(2) F(3) G(4)
    //   Row 2: Q(0)     W(1) E(2) R(3) T(4)
    //   Row 3: 1(0)     2(1) 3(2) 4(3) 5(4)
    //   Row 4: 0(0)     9(1) 8(2) 7(3) 6(4)
    //   Row 5: P(0)     O(1) I(2) U(3) Y(4)
    //   Row 6: ENTER(0) L(1) K(2) J(3) H(4)
    //   Row 7: SPACE(0) SYM(1) M(2) N(3) B(4)
    //
    // Kempston bits: 0=right, 1=left, 2=down, 3=up, 4=fire
    // -----------------------------------------------------------------------

    // Map browser key codes to Spectrum [row, bit] pairs.
    // Chosen to be sensible for Jetpac: Q=up, A=down, O=left, P=right, Space=fire.
    const spectrumKeyMap = {
      // Letters — direct Spectrum key positions
      'KeyQ':     [2, 0], 'KeyW': [2, 1], 'KeyE': [2, 2], 'KeyR': [2, 3], 'KeyT': [2, 4],
      'KeyA':     [1, 0], 'KeyS': [1, 1], 'KeyD': [1, 2], 'KeyF': [1, 3], 'KeyG': [1, 4],
      'KeyZ':     [0, 1], 'KeyX': [0, 2], 'KeyC': [0, 3], 'KeyV': [0, 4],
      'KeyY':     [5, 4], 'KeyU': [5, 3], 'KeyI': [5, 2], 'KeyO': [5, 1], 'KeyP': [5, 0],
      'KeyH':     [6, 4], 'KeyJ': [6, 3], 'KeyK': [6, 2], 'KeyL': [6, 1],
      'KeyB':     [7, 4], 'KeyN': [7, 3], 'KeyM': [7, 2],
      // Digits row
      'Digit1':   [3, 0], 'Digit2': [3, 1], 'Digit3': [3, 2], 'Digit4': [3, 3], 'Digit5': [3, 4],
      'Digit6':   [4, 4], 'Digit7': [4, 3], 'Digit8': [4, 2], 'Digit9': [4, 1], 'Digit0': [4, 0],
      // Special keys
      'Space':    [7, 0],
      'Enter':    [6, 0],
      'ShiftLeft':  [0, 0], 'ShiftRight': [0, 0],
    };

    // Keys that should call preventDefault to avoid browser scrolling/navigation.
    const preventDefaultKeys = new Set([
      'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
    ]);

    // Kempston joystick: arrow keys + Z = fire
    const kempstonKeyMap = {
      'ArrowRight': 0, 'ArrowLeft': 1, 'ArrowDown': 2, 'ArrowUp': 3, 'KeyZ': 4,
    };

    document.addEventListener('keydown', (e) => {
      if (preventDefaultKeys.has(e.code)) e.preventDefault();
      const spec = spectrumKeyMap[e.code];
      if (spec) emulator.key_down(spec[0], spec[1]);
      const kemp = kempstonKeyMap[e.code];
      if (kemp !== undefined) emulator.kempston_down(kemp);
    });

    document.addEventListener('keyup', (e) => {
      const spec = spectrumKeyMap[e.code];
      if (spec) emulator.key_up(spec[0], spec[1]);
      const kemp = kempstonKeyMap[e.code];
      if (kemp !== undefined) emulator.kempston_up(kemp);
    });

    // Release all keys if the window loses focus, to avoid stuck keys.
    window.addEventListener('blur', () => {
      emulator.keyboard_reset();
    });
  </script>
</body>
</html>
