<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23D7D7D7'/><text x='2' y='13' font-family='monospace' font-size='14' font-weight='bold' fill='%230022C7'>Z</text></svg>" />
  <title>zxw debug</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      font-family: monospace;
      color: #ccc;
      gap: 10px;
    }
    canvas {
      image-rendering: pixelated;
      border: 4px solid #444;
      width: 512px;
      height: 384px;
    }
    #status { color: #888; font-size: 12px; }
    button.btn {
      cursor: pointer;
      background: #333;
      color: #ccc;
      font-family: monospace;
      font-size: 13px;
      padding: 5px 12px;
      border: 1px solid #666;
      border-radius: 3px;
    }
    button.btn:hover { background: #444; }
  </style>
</head>
<body>
  <canvas id="screen" width="256" height="192"></canvas>
  <span id="status">Initialising…</span>
  <div style="display:flex;gap:8px;">
    <button id="pause-btn" class="btn">⏸ Pause (P)</button>
    <button class="btn" onclick="location.reload()">Reload</button>
  </div>

  <script type="module">
    import init, { init as zxwInit, Emulator } from './pkg/zxw.js';
    import { initAudio, feedAudio, resumeAudio, toggleMute, isMuted, audioStats } from './audio.js';

    const log  = (...a) => console.log('[zxw-debug]', ...a);
    const status = document.getElementById('status');
    const set  = t => { status.textContent = t; log(t); };

    await init();
    zxwInit('screen');
    const emulator = new Emulator('screen');

    // -- Debug API ----------------------------------------------------------
    window.zxw = {
      mem:        (addr, len)      => emulator.read_memory(addr, len || 16),
      poke:       (addr, ...bytes) => emulator.write_memory(addr, new Uint8Array(bytes)),
      regs:       ()               => emulator.read_registers(),
      bp:         (addr)           => emulator.set_breakpoint(addr),
      clearBp:    (addr)           => emulator.clear_breakpoint(addr),
      clearAllBp: ()               => emulator.clear_all_breakpoints(),
      pause:      ()               => emulator.pause(),
      resume:     ()               => emulator.resume(),
      step:       ()               => emulator.step_single(),
      screen:     ()               => emulator.read_memory(0x4000, 6912),
      watch:      (addr)           => emulator.add_watchpoint(addr),
      unwatch:    (addr)           => emulator.remove_watchpoint(addr),
      hits:       ()               => emulator.get_watchpoint_hits(),
      audio:      ()               => audioStats(),
      pc:         (addr)           => emulator.set_pc(addr),
      getpc:      ()               => emulator.get_pc(),
    };
    log('debug API: window.zxw — zxw.regs(), zxw.mem(0x4000, 16)');

    // -- Pause toggle (P key + button) --------------------------------------

    const pauseBtn = document.getElementById('pause-btn');
    let paused = false;

    function togglePause() {
      if (paused) {
        emulator.resume();
        resumeAudio();
        paused = false;
        pauseBtn.textContent = '⏸ Pause (P)';
        set('Running…');
      } else {
        emulator.pause();
        paused = true;
        pauseBtn.textContent = '▶ Play (P)';
        set('Paused');
      }
    }

    pauseBtn.addEventListener('click', togglePause);

    // -- Auto-load + run ----------------------------------------------------

    async function fetchBytes(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`fetch ${path} → ${res.status}`);
      return new Uint8Array(await res.arrayBuffer());
    }

    let rafId = null;

    function startFrameLoop() {
      function frame() {
        try {
          if (emulator.is_paused()) {
            emulator.render_frame();
          } else {
            emulator.step_frame();
            feedAudio(emulator.drain_audio());
          }
        } catch (err) {
          log('frame error:', err);
          set(`Error: ${err}`);
          return;
        }
        rafId = requestAnimationFrame(frame);
      }
      rafId = requestAnimationFrame(frame);
    }

    async function autoTypeLOAD() {
      const delay = ms => new Promise(r => setTimeout(r, ms));
      const press = async (row, bit, ms = 80) => {
        emulator.key_down(row, bit);
        await delay(ms);
        emulator.key_up(row, bit);
        await delay(60);
      };

      log('waiting 3s for ROM to boot before typing LOAD ""');
      await delay(3000);
      set('Typing LOAD ""…');

      // J → LOAD keyword (row 6, bit 3)
      log('auto-type: J (LOAD)');
      await press(6, 3);
      await delay(100);

      // Sym+P → " (twice)
      for (let i = 0; i < 2; i++) {
        log('auto-type: Sym+P (")');
        emulator.key_down(7, 1);
        await delay(20);
        await press(5, 0);
        emulator.key_up(7, 1);
        await delay(100);
      }

      // ENTER (row 6, bit 0)
      log('auto-type: ENTER');
      await press(6, 0);

      set('Running…');
      log('LOAD "" sent — tape should start loading');
    }

    try {
      set('Loading ROM…');
      const rom = await fetchBytes('./rom/48.rom');
      emulator.load_rom(rom);
      log(`ROM loaded (${rom.length} bytes)`);

      set('Loading TAP…');
      const tap = await fetchBytes('./tap/debug.tap');
      emulator.load_tap(tap);
      log(`TAP loaded (${tap.length} bytes)`);

      set('Booting…');
      emulator.reset();
      await initAudio();
      await resumeAudio();
      startFrameLoop();

      autoTypeLOAD();
    } catch (err) {
      log('startup error:', err);
      set(`Error: ${err.message}`);
    }

    // -- Keyboard -----------------------------------------------------------

    const spectrumKeyMap = {
      'KeyQ': [2,0], 'KeyW': [2,1], 'KeyE': [2,2], 'KeyR': [2,3], 'KeyT': [2,4],
      'KeyA': [1,0], 'KeyS': [1,1], 'KeyD': [1,2], 'KeyF': [1,3], 'KeyG': [1,4],
      'KeyZ': [0,1], 'KeyX': [0,2], 'KeyC': [0,3], 'KeyV': [0,4],
      'KeyY': [5,4], 'KeyU': [5,3], 'KeyI': [5,2], 'KeyO': [5,1], 'KeyP': [5,0],
      'KeyH': [6,4], 'KeyJ': [6,3], 'KeyK': [6,2], 'KeyL': [6,1],
      'KeyB': [7,4], 'KeyN': [7,3], 'KeyM': [7,2],
      'Digit1': [3,0], 'Digit2': [3,1], 'Digit3': [3,2], 'Digit4': [3,3], 'Digit5': [3,4],
      'Digit6': [4,4], 'Digit7': [4,3], 'Digit8': [4,2], 'Digit9': [4,1], 'Digit0': [4,0],
      'Space': [7,0], 'Enter': [6,0],
      'ShiftLeft': [0,0], 'ShiftRight': [0,0],
    };
    const preventDefaultKeys = new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
    const kempstonKeyMap = { 'ArrowRight': 0, 'ArrowLeft': 1, 'ArrowDown': 2, 'ArrowUp': 3, 'KeyZ': 4 };

    document.addEventListener('keydown', e => {
      if (e.code === 'KeyP' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        togglePause();
        return;
      }
      if (preventDefaultKeys.has(e.code)) e.preventDefault();
      const spec = spectrumKeyMap[e.code];
      if (spec) emulator.key_down(spec[0], spec[1]);
      const kemp = kempstonKeyMap[e.code];
      if (kemp !== undefined) emulator.kempston_down(kemp);
    });
    document.addEventListener('keyup', e => {
      const spec = spectrumKeyMap[e.code];
      if (spec) emulator.key_up(spec[0], spec[1]);
      const kemp = kempstonKeyMap[e.code];
      if (kemp !== undefined) emulator.kempston_up(kemp);
    });
    window.addEventListener('blur', () => emulator.keyboard_reset());
  </script>
</body>
</html>
